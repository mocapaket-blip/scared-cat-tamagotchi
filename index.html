<!-- Game state (vanilla JS, runs before React) -->
<script>
const _SK = 'scared_cat_v2';
const _RATES = { hunger:0.14, fatigue:0.09, toilet:0.07, mood:-0.05 };

function _clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function _defaultStats(){
  return { hunger:10, fatigue:10, toilet:5, mood:90, health:90 };
}

function _applyDecay(stats, minutes){
  if(minutes <= 0) return { ...stats };
  const s = { ...stats };
  s.hunger  = _clamp(s.hunger  + _RATES.hunger  * minutes, 0, 100);
  s.fatigue = _clamp(s.fatigue + _RATES.fatigue * minutes, 0, 100);
  s.toilet  = _clamp(s.toilet  + _RATES.toilet  * minutes, 0, 100);
  s.mood    = _clamp(s.mood    + _RATES.mood    * minutes, 0, 100);
  const crits = [s.hunger>=80, s.fatigue>=80, s.toilet>=80, s.mood<=20].filter(Boolean).length;
  const hRate = crits >= 2 ? -0.12 : -0.015;
  s.health = _clamp(s.health + hRate * minutes, 0, 100);
  return s;
}

function _buildComplaint(stats, minutes){
  if(minutes < 30) return null;
  const h = Math.floor(minutes/60), m = Math.floor(minutes%60);
  const timeStr = h>0 ? h+' ч '+(m>0?m+' мин':'') : m+' мин';
  const issues = [];
  if(stats.hunger  >= 60) issues.push('проголодался ('   +Math.round(stats.hunger)+'%)');
  if(stats.toilet  >= 60) issues.push('хочет в туалет (' +Math.round(stats.toilet)+'%)');
  if(stats.mood    <= 40) issues.push('грустит (настр. ' +Math.round(stats.mood)+'%)');
  if(stats.fatigue >= 60) issues.push('устал ('          +Math.round(stats.fatigue)+'%)');
  if(stats.health  <= 60) issues.push('заболевает (здоровье '+Math.round(stats.health)+'%)');
  let msg = minutes < 120
    ? `Ты где пропал(а)?! Меня не было ${timeStr}!`
    : minutes < 360
    ? `${h} ч без тебя! Мне было так одиноко... 😿`
    : minutes < 720
    ? `${h} часов одиночества! Я думал(а), ты не вернёшься...`
    : `${h} часов тебя не было!! Чуть не умер(ла) со скуки! 😭`;
  if(issues.length) msg += '\n\nПока тебя не было:\n• ' + issues.join('\n• ');
  return msg;
}

window.__GAME = {
  load(){ try{ const r=localStorage.getItem(_SK); return r?JSON.parse(r):null; }catch(e){ return null; } },
  save(s){ try{ localStorage.setItem(_SK, JSON.stringify({...s,lastUpdate:Date.now()})); }catch(e){} },
  defaultStats: _defaultStats,
  applyDecay:   _applyDecay,
  buildComplaint: _buildComplaint,
  clamp: _clamp,
};

      {[290,340,390,440,490,540,590,640].map((y,i)=><line key={i} x1="0" y1={y} x2="390" y2={y} stroke="#1a0800" strokeWidth="1.8" opacity="0.35"/>)}
      {[78,156,234,312].map((x,i)=><line key={i} x1={x} y1="278" x2={x} y2="650" stroke="#1a0800" strokeWidth="1.8" opacity="0.35"/>)}
    </svg>
  );
}

/* ══════ THOUGHT BUBBLE ══════ */
function ThoughtBubble({ emoji }) {
  return (
    <div style={{ position:'relative', animation:'thoughtBounce 2s ease-in-out infinite' }}>
      <div style={{ position:'absolute', bottom:-6, left:12, width:9, height:9, borderRadius:'50%', background:'white', border:'2.5px solid #1a0800' }}/>
      <div style={{ position:'absolute', bottom:-13, left:7, width:6, height:6, borderRadius:'50%', background:'white', border:'2px solid #1a0800' }}/>
      <div style={{ background:'white', border:'3px solid #1a0800', borderRadius:22, padding:'5px 8px', fontSize:26, boxShadow:'0 4px 14px rgba(0,0,0,0.35)', display:'flex', alignItems:'center', justifyContent:'center', minWidth:46, animation:'bubblePop 0.3s ease' }}>
        {emoji}
      </div>
    </div>
  );
}

/* ══════ PAW INDICATOR ══════ */
function PawShape({ fillColor, baseColor, clipId }) {
  const shape = (c) => (
    <g>
      <ellipse cx="14" cy="44" rx="11" ry="10" fill={c}/>
      <ellipse cx="31" cy="32" rx="11" ry="10" fill={c}/>
      <ellipse cx="49" cy="32" rx="11" ry="10" fill={c}/>
      <ellipse cx="66" cy="44" rx="11" ry="10" fill={c}/>
      <ellipse cx="40" cy="72" rx="26" ry="20" fill={c}/>
    </g>
  );
  return (
    <g>
      <g opacity="0.15">
        <ellipse cx="14" cy="44" rx="13" ry="12" fill="#1a0800"/>
        <ellipse cx="31" cy="32" rx="13" ry="12" fill="#1a0800"/>
        <ellipse cx="49" cy="32" rx="13" ry="12" fill="#1a0800"/>
        <ellipse cx="66" cy="44" rx="13" ry="12" fill="#1a0800"/>
        <ellipse cx="40" cy="72" rx="28" ry="22" fill="#1a0800"/>
      </g>
      {shape(baseColor)}
      <g clipPath={`url(#${clipId})`}>{shape(fillColor)}</g>
      <g clipPath={`url(#${clipId})`} opacity="0.25"><ellipse cx="28" cy="60" rx="12" ry="22" fill="white"/></g>
    </g>
  );
}

function PawIndicator({ pawId, icon, label, fill, critical, onClick }) {
  const fillColor = critical ? '#ff2828' : fill > 58 ? '#42cc78' : fill > 28 ? '#f5a020' : '#ff5840';
  const baseColor = critical ? '#ffc8c8' : '#ddd0c0';
  const clipY = 92 * (1 - fill / 100);
  const clipH = Math.max(0, 92 * fill / 100);
  return (
    <div onClick={onClick} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, cursor:'pointer' }}>
      <div style={{ position:'relative', animation: critical ? 'pulseCrit 0.75s ease-in-out infinite' : 'none', transition:'transform 0.12s' }}
           onPointerDown={e => e.currentTarget.style.transform='scale(0.88)'}
           onPointerUp={e => e.currentTarget.style.transform='scale(1)'}
           onPointerLeave={e => e.currentTarget.style.transform='scale(1)'}>
        <svg viewBox="0 0 80 92" width="50" height="60" style={{display:'block'}}>
          <defs><clipPath id={pawId}><rect x="0" y={clipY} width="80" height={clipH}/></clipPath></defs>
          <PawShape fillColor={fillColor} baseColor={baseColor} clipId={pawId}/>
        </svg>
        <div style={{ position:'absolute', left:'50%', bottom:4, transform:'translateX(-50%)', fontSize:15, lineHeight:1, pointerEvents:'none', filter:'drop-shadow(0 1px 2px rgba(0,0,0,0.35))' }}>{icon}</div>
      </div>
      <span style={{ fontSize:8, fontWeight:800, color:'#2a1008', letterSpacing:0.1 }}>{label}</span>
    </div>
  );
}

/* ══════ FLOATING HEART ══════ */
function FloatingHeart({ id, x, y, onDone }) {
  return (
    <div onAnimationEnd={onDone} style={{ position:'absolute', left:x, top: y||'38%', fontSize:20, animation:'heartPop 1.1s ease-out forwards', pointerEvents:'none', zIndex:30 }}>
      {['❤️','💖','💕','🩷'][Math.floor(Math.random()*4)]}
    </div>
  );
}

/* ══════ NAV ITEM ══════ */
function NavItem({ icon, label, active, dot, onClick }) {
  return (
    <button onClick={onClick} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:2, background:'none', border:'none', cursor:'pointer', padding:'6px 4px 2px', position:'relative' }}>
      {dot && <div style={{ position:'absolute', top:4, right:'50%', marginRight:-14, width:8, height:8, borderRadius:99, background:'#ff5070', border:'2px solid white' }}/>}
      <span style={{ fontSize:22, filter: active ? 'none' : 'grayscale(0.5) opacity(0.5)' }}>{icon}</span>
      <span style={{ fontSize:10, fontWeight: active ? 800 : 600, color: active ? '#a04820' : '#806048' }}>{label}</span>
      {active && <div style={{ width:18, height:3, borderRadius:99, background:'#c06030', marginTop:1 }}/>}
    </button>
  );
}

/* ══════ BOTTOM PANEL ══════ */
function BottomPanel({ fills, isCrit, onPawClick, activeNav, setActiveNav }) {
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, background:'linear-gradient(180deg,#f8f0e2 0%,#f2e8d4 100%)', borderRadius:'26px 26px 0 0', boxShadow:'0 -6px 32px rgba(0,0,0,0.4)', padding:'12px 12px 0', zIndex:20, height:192, display:'flex', flexDirection:'column' }}>
      <div style={{ background:'rgba(255,255,255,0.5)', borderRadius:18, padding:'8px 4px', display:'flex', justifyContent:'space-around', alignItems:'flex-end', border:'1.5px solid rgba(255,255,255,0.85)', flex:1, marginBottom:10 }}>
        <PawIndicator pawId="ph"  icon="🍗" label="Голод"     fill={fills.hunger}  critical={isCrit(fills.hunger)}  onClick={() => onPawClick('kitchen')}/>
        <PawIndicator pawId="pt"  icon="🚽" label="Туалет"    fill={fills.toilet}  critical={isCrit(fills.toilet)}  onClick={() => onPawClick('bathroom')}/>
        <PawIndicator pawId="pf"  icon="😴" label="Усталость" fill={fills.fatigue} critical={isCrit(fills.fatigue)} onClick={() => onPawClick('rest')}/>
        <PawIndicator pawId="pm"  icon="❤️" label="Настроение" fill={fills.mood}   critical={isCrit(fills.mood)}    onClick={() => onPawClick('yard')}/>
        <PawIndicator pawId="phh" icon="💊" label="Здоровье"  fill={fills.health}  critical={isCrit(fills.health)}  onClick={() => onPawClick('clinic')}/>
      </div>
      <div style={{ display:'flex', borderTop:'1.5px solid rgba(0,0,0,0.07)', background:'rgba(255,255,255,0.65)', marginLeft:-12, marginRight:-12, paddingBottom:10, flexShrink:0 }}>
        <NavItem icon="🏠" label="Дом"        active={activeNav==='home'}    onClick={() => { setActiveNav('home'); onPawClick('home'); }}/>
        <NavItem icon="🛍️" label="Магазин"    active={activeNav==='shop'}    onClick={() => setActiveNav('shop')}/>
        <NavItem icon="🏆" label="Достижения" active={activeNav==='achieve'} dot onClick={() => setActiveNav('achieve')}/>
        <NavItem icon="📸" label="Альбом"     active={activeNav==='album'}   onClick={() => setActiveNav('album')}/>
      </div>
    </div>
  );
}

/* ══════ ACTION BUTTON ══════ */
function ActionBtn({ emoji, label, color, onClick, done }) {
  const grads   = { orange:'linear-gradient(155deg,#ffd060,#f0a020)', blue:'linear-gradient(155deg,#80d0f8,#40a8e0)', purple:'linear-gradient(155deg,#d0a8f8,#a070e0)', green:'linear-gradient(155deg,#80e890,#40c050)', teal:'linear-gradient(155deg,#70e8d8,#30c0a8)' };
  const shadows = { orange:'0 6px 0 #c07808', blue:'0 6px 0 #2878b0', purple:'0 6px 0 #7040b0', green:'0 6px 0 #208030', teal:'0 6px 0 #108878' };
  const [pressed, setPressed] = useState(false);
  return (
    <button disabled={done}
      onPointerDown={() => setPressed(true)} onPointerUp={() => { setPressed(false); onClick?.(); }} onPointerLeave={() => setPressed(false)}
      style={{ background: done ? '#c8c0b8' : grads[color], border:'none', borderRadius:22, padding:'16px 40px', cursor: done ? 'default' : 'pointer', display:'flex', alignItems:'center', gap:12, boxShadow: pressed||done ? 'none' : shadows[color], transform: pressed ? 'translateY(5px)' : 'translateY(0)', transition:'all 0.12s' }}>
      <span style={{ fontSize:32 }}>{done ? '✅' : emoji}</span>
      <span style={{ fontSize:16, fontWeight:900, color:'white', textShadow:'0 2px 4px rgba(0,0,0,0.25)' }}>{done ? 'Готово!' : label}</span>
    </button>
  );
}

/* ══════ LOCATION SCREEN ══════ */
function LocationScreen({ screen, onBack, onAction, actionDone, catX, catFacing, RoomComp, actionEmoji, actionLabel, actionColor, fills, isCrit, activeNav, setActiveNav, onPawClick, hearts, removeHeart, locationName }) {
  const PANEL_H = 192;
  return (
    <div key={screen} style={{ position:'absolute', inset:0, animation:'screenFade 0.3s ease', zIndex:50, background:'#3a2010' }}>
      <div style={{ position:'absolute', top:0, left:0, right:0, bottom:PANEL_H }}>
        <RoomComp/>
      </div>
      {hearts.map(h => <FloatingHeart key={h.id} id={h.id} x={h.x} y={h.y} onDone={() => removeHeart(h.id)}/>)}
      <div style={{ position:'absolute', top:0, left:0, right:0, zIndex:60, display:'flex', alignItems:'center', gap:12, padding:'14px 16px 0' }}>
        <button onClick={onBack} style={{ background:'rgba(20,8,0,0.6)', border:'1.5px solid rgba(255,255,255,0.15)', borderRadius:12, width:38, height:38, cursor:'pointer', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center', color:'white' }}>←</button>
        <span style={{ fontSize:18, fontWeight:900, color:'#f5dfc0', textShadow:'0 1px 6px rgba(0,0,0,0.6)' }}>{locationName}</span>
      </div>
      <div style={{ position:'absolute', bottom:PANEL_H+22, left:catX, width:148, filter:'drop-shadow(0 0 10px rgba(255,255,255,0.4)) drop-shadow(0 8px 18px rgba(0,0,0,0.7))', transform:`scaleX(${catFacing})`, transformOrigin:'center' }}>
        <img src={CAT} alt="Кот" style={{ width:'100%', display:'block' }} draggable="false"/>
      </div>
      <div style={{ position:'absolute', bottom:PANEL_H+16, left:0, right:0, display:'flex', justifyContent:'center', zIndex:55, animation:'slideUp 0.4s ease' }}>
        {!actionDone
          ? <ActionBtn emoji={actionEmoji} label={actionLabel} color={actionColor} onClick={onAction} done={false}/>
          : <div style={{ fontSize:14, fontWeight:800, color:'white', textShadow:'0 2px 6px rgba(0,0,0,0.8)', animation:'slideUp 0.3s ease' }}>Возвращаюсь домой… 🐾</div>
        }
      </div>
      <BottomPanel fills={fills} isCrit={isCrit} onPawClick={onPawClick} activeNav={activeNav} setActiveNav={setActiveNav}/>
    </div>
  );
}

/* ══════ COMPLAINT OVERLAY ══════ */
function ComplaintOverlay({ text, onClose }) {
  return (
    <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.72)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:24, backdropFilter:'blur(4px)' }}>
      <div style={{ background:'linear-gradient(160deg,#f8f0e2,#f0e4cc)', borderRadius:28, padding:'28px 24px', maxWidth:320, width:'100%', boxShadow:'0 8px 40px rgba(0,0,0,0.5)', border:'3px solid #1a0800', animation:'complaintIn 0.35s ease', textAlign:'center' }}>
        <img src={CAT} alt="Кот" style={{ width:110, marginBottom:12 }} draggable="false"/>
        <div style={{ fontSize:20, fontWeight:900, color:'#3a1808', marginBottom:10 }}>Котик скучал! 😿</div>
        <div style={{ fontSize:13, color:'#5a3018', lineHeight:1.7, marginBottom:22, whiteSpace:'pre-line' }}>{text}</div>
        <button onClick={onClose} style={{ background:'linear-gradient(155deg,#ffd060,#f0a020)', border:'none', borderRadius:18, padding:'14px 36px', fontSize:16, fontWeight:900, color:'white', cursor:'pointer', boxShadow:'0 5px 0 #c07808', width:'100%' }}>
          Прости, котик! 🥺
        </button>
      </div>
    </div>
  );
}

/* ══════ INIT HELPER (runs once, outside React) ══════ */
const _INIT = (() => {
  try {
    const saved = G.load();
    const now = Date.now();
    if (saved && saved.stats) {
      const minsAway = Math.max(0, (now - (saved.lastUpdate || now)) / 60000);
      const stats = G.applyDecay(saved.stats, minsAway);
      return { stats, coins: saved.coins != null ? saved.coins : 125,
               createdAt: saved.createdAt || now, complaint: G.buildComplaint(stats, minsAway) };
    }
  } catch(e) { console.warn('State load error:', e); }
  const stats = G.defaultStats();
  return { stats, coins: 125, createdAt: Date.now(), complaint: null };
})();

/* ══════ APP ══════ */
function App() {
  const [screen,     setScreen]     = useState('home');
  const [stats,      setStats]      = useState(_INIT.stats);
  const [coins,      setCoins]      = useState(_INIT.coins);
  const [complaint,  setComplaint]  = useState(_INIT.complaint);
  const [hearts,     setHearts]     = useState([]);
  const [activeNav,  setActiveNav]  = useState('home');
  const [catX,       setCatX]       = useState(111);
  const [catFacing,  setCatFacing]  = useState(1);
  const [showGif,    setShowGif]    = useState(false);
  const [actionDone, setActionDone] = useState(false);
  const createdAt = useRef(_INIT.createdAt);
  const walkRef   = useRef({ x:111, dir:1 });
  const gifTimer  = useRef(null);
  const heartId   = useRef(0);

  const day = Math.max(1, Math.floor((Date.now() - createdAt.current) / 86400000) + 1);

  // Telegram init
  useEffect(() => {
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }
  }, []);

  // Save state whenever stats/coins change
  useEffect(() => {
    G.save({ stats, coins, createdAt: createdAt.current });
  }, [stats, coins]);

  // In-app decay tick every 10 seconds
  useEffect(() => {
    const t = setInterval(() => {
      setStats(p => G.applyDecay(p, 10/60));
    }, 10000);
    return () => clearInterval(t);
  }, []);

  // Walking cat animation
  useEffect(() => {
    if (screen !== 'home' || showGif) return;
    const t = setInterval(() => {
      const s = walkRef.current;
      s.x += s.dir * 1.4;
      if (s.x >= 208) { s.x = 208; s.dir = -1; setCatFacing(-1); }
      if (s.x <= 12)  { s.x = 12;  s.dir =  1; setCatFacing(1); }
      setCatX(s.x);
    }, 50);
    return () => clearInterval(t);
  }, [screen, showGif]);

  // Paw fill values (higher = better)
  const fills = {
    hunger:  Math.round(100 - stats.hunger),
    toilet:  Math.round(100 - stats.toilet),
    fatigue: Math.round(100 - stats.fatigue),
    mood:    Math.round(stats.mood),
    health:  Math.round(stats.health),
  };
  const isCrit = v => v <= 20;

  // Thought bubble: show worst need
  const thoughtEmojis = { hunger:'🍗', toilet:'🚽', fatigue:'😴', mood:'💔', health:'🤒' };
  const sortedFills = Object.entries(fills).sort((a, b) => a[1] - b[1]);
  const worstKey = sortedFills.length > 0 ? sortedFills[0][0] : 'mood';
  const thoughtEmoji = fills[worstKey] > 65 ? '😊' : (thoughtEmojis[worstKey] || '😊');

  const spawnHearts = useCallback((n=3, baseX=115) => {
    const hs = Array.from({length:n}, () => ({ id:++heartId.current, x: baseX + Math.random()*140, y:'38%' }));
    setHearts(p => [...p, ...hs]);
  }, []);

  const removeHeart = useCallback(id => setHearts(p => p.filter(h => h.id !== id)), []);

  const handleCatClick = () => {
    walkRef.current.x = 111; walkRef.current.dir = 1;
    setCatX(111); setCatFacing(1);
    if (showGif) return;
    setShowGif(true);
    clearTimeout(gifTimer.current);
    gifTimer.current = setTimeout(() => setShowGif(false), 3000);
  };

  const handlePawClick = (dest) => {
    if (dest === 'home') { setScreen('home'); setActionDone(false); return; }
    setScreen(dest); setActionDone(false); setShowGif(false);
  };

  const handleAction = () => {
    spawnHearts(5, 80);
    setCoins(c => c + 10);
    setActionDone(true);
    setStats(prev => {
      const s = { ...prev };
      const cl = (v,a,b) => G.clamp(v,a,b);
      if (screen==='kitchen')  { s.hunger  = cl(s.hunger  - 30, 0, 100); }
      if (screen==='bathroom') { s.toilet  = cl(s.toilet  - 24, 0, 100); }
      if (screen==='rest')     { s.fatigue = cl(s.fatigue - 38, 0, 100); s.mood = cl(s.mood+5, 0, 100); }
      if (screen==='yard')     { s.mood    = cl(s.mood    + 20, 0, 100); s.fatigue = cl(s.fatigue+8, 0, 100); }
      if (screen==='clinic')   { s.health  = cl(s.health  + 30, 0, 100); }
      return s;
    });
    setTimeout(() => { setScreen('home'); setActionDone(false); }, 2000);
  };

  const LOCATIONS = {
    kitchen:  { RoomComp:KitchenRoom,  actionEmoji:'🍗', actionLabel:'Покормить',    actionColor:'orange', name:'🍗 Кухня',          catX:82,  catFacing:1  },
    bathroom: { RoomComp:BathroomRoom, actionEmoji:'🚽', actionLabel:'В туалет',      actionColor:'blue',   name:'🚽 Туалет',         catX:60,  catFacing:1  },
    rest:     { RoomComp:RestRoom,     actionEmoji:'🌙', actionLabel:'Уложить спать', actionColor:'purple', name:'🌙 Комната отдыха', catX:100, catFacing:1  },
    yard:     { RoomComp:YardRoom,     actionEmoji:'🧶', actionLabel:'Поиграть',      actionColor:'green',  name:'🌳 Двор',           catX:145, catFacing:-1 },
    clinic:   { RoomComp:ClinicRoom,   actionEmoji:'💊', actionLabel:'Лечить',        actionColor:'teal',   name:'🏥 Клиника',        catX:115, catFacing:1  },
  };

  const PANEL_H = 192;

  // Location screen
  if (screen !== 'home') {
    const loc = LOCATIONS[screen];
    return (
      <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden', background:'#3a2010' }}>
        <LocationScreen
          screen={screen} onBack={() => { setScreen('home'); setActionDone(false); }}
          onAction={handleAction} actionDone={actionDone}
          catX={loc.catX} catFacing={loc.catFacing}
          RoomComp={loc.RoomComp} actionEmoji={loc.actionEmoji}
          actionLabel={loc.actionLabel} actionColor={loc.actionColor} locationName={loc.name}
          fills={fills} isCrit={isCrit} activeNav={activeNav} setActiveNav={setActiveNav}
          onPawClick={handlePawClick} hearts={hearts} removeHeart={removeHeart}
        />
        {complaint && <ComplaintOverlay text={complaint} onClose={() => setComplaint(null)}/>}
      </div>
    );
  }

  // Home screen
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden', background:'#3a2010', fontFamily:"'Nunito',sans-serif" }}>
      <div style={{ position:'absolute', top:0, left:0, right:0, bottom:PANEL_H-30, overflow:'hidden' }}>
        <HomeRoom/>
      </div>
      {hearts.map(h => <FloatingHeart key={h.id} id={h.id} x={h.x} y={h.y} onDone={() => removeHeart(h.id)}/>)}

      {/* Header */}
      <div style={{ position:'relative', zIndex:20, display:'flex', alignItems:'flex-start', justifyContent:'space-between', padding:'14px 16px 0' }}>
        <div>
          <div style={{ fontSize:22, fontWeight:900, color:'#f5dfc0', letterSpacing:-0.5, textShadow:'0 1px 6px rgba(0,0,0,0.6)' }}>My Kitty 🐾</div>
          <div style={{ fontSize:12, color:'#c8a870', fontWeight:700, marginTop:1 }}>День {day}</div>
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}>
          <div style={{ display:'flex', alignItems:'center', gap:5, padding:'6px 13px', background:'rgba(20,8,0,0.6)', borderRadius:99, boxShadow:'0 2px 10px rgba(0,0,0,0.45)', border:'1.5px solid rgba(255,255,255,0.12)' }}>
            <span style={{ fontSize:15 }}>😊</span>
            <span style={{ fontSize:14, fontWeight:900, color:'#f5dfc0' }}>{coins}</span>
            <span style={{ fontSize:13, color:'#e0a030', fontWeight:900 }}>+</span>
          </div>
          <div style={{ width:38, height:38, borderRadius:12, background:'rgba(20,8,0,0.6)', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 2px 10px rgba(0,0,0,0.45)', cursor:'pointer', fontSize:17, border:'1.5px solid rgba(255,255,255,0.12)' }}>⚙️</div>
        </div>
      </div>

      {/* Thought bubble follows cat */}
      <div style={{ position:'absolute', zIndex:16, pointerEvents:'none', left: catX + (catFacing === 1 ? 128 : -60), bottom: PANEL_H + 24 + 152, transition:'left 0.1s linear' }}>
        <ThoughtBubble emoji={thoughtEmoji}/>
      </div>

      {/* Walking cat */}
      <div onClick={handleCatClick}
           style={{ position:'absolute', zIndex:15, bottom: PANEL_H + 24, left: catX, width:168, cursor:'pointer', transition: showGif ? 'left 0.25s ease-out' : 'none' }}>
        <div style={{ transform:`scaleX(${catFacing})`, transformOrigin:'center', filter:'drop-shadow(0 0 12px rgba(255,255,255,0.4)) drop-shadow(0 14px 28px rgba(0,0,0,0.6))', animation: showGif ? 'none' : 'catWalkBob 0.55s ease-in-out infinite', position:'relative' }}>
          <img src={CAT} alt="Кот"
               style={{ width:'100%', display:'block', userSelect:'none', pointerEvents:'none', opacity: showGif ? 0 : 1, transition:'opacity 0.2s' }}
               draggable="false"/>
          {showGif && (
            <img src={GIF} alt="Анимация"
                 style={{ position:'absolute', inset:0, width:'100%', display:'block', userSelect:'none', pointerEvents:'none' }}
                 draggable="false"/>
          )}
        </div>
      </div>

      <BottomPanel fills={fills} isCrit={isCrit} onPawClick={handlePawClick} activeNav={activeNav} setActiveNav={setActiveNav}/>

      {complaint && <ComplaintOverlay text={complaint} onClose={() => setComplaint(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
